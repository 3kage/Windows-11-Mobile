name: Android Build

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build, export and verify release APK
        run: ./gradlew buildApk --no-daemon --stacktrace

      - name: Print APK checksum
        run: |
          APK=(build/dist/*.apk)
          ls -lh "${APK[@]}"
          sha256sum "${APK[@]}"
          echo "### Install this file (not the .zip wrapper)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** \`${APK[0]##*/}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size:** $(stat -c%s "${APK[0]}") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256:** \`$(sha256sum "${APK[0]}" | awk '{print $1}')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Important:** If you downloaded from Actions, unzip first — install the \`.apk\`, not the artifact \`.zip\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: windows11-mobile-release-apk
          path: build/dist/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
